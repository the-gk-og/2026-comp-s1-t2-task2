{% extends "base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<main class="admin-page">
  <section class="panel">
    <h1>Admin Dashboard</h1>
    <p class="muted">Create events and build registration forms.</p>

    <div class="field">
      <label for="eventSelect">Select Event</label>
      <select id="eventSelect"></select>
    </div>

    <div class="actions">
      <button id="copyLinkBtn" class="btn">Copy event link</button>
      <button id="deleteEventBtn" class="btn btn-danger">Delete event</button>
    </div>

    <hr />

    <h2>Create Event</h2>
    <div class="field"><label for="eventName">Event name</label><input id="eventName" /></div>
    <div class="field"><label for="eventDesc">Description</label><textarea id="eventDesc"></textarea></div>

    <h3>Form builder</h3>
    <div class="field">
      <label for="fieldPreset">Pre-built fields</label>
      <div class="actions">
        <select id="fieldPreset">
          <option value="">Select a template</option>
          <option value="email">Email</option>
          <option value="dob">Date of Birth</option>
          <option value="phone">Phone</option>
          <option value="full_name">Full Name</option>
        </select>
        <button id="applyPresetBtn" class="btn">Use template</button>
      </div>
    </div>

    <div class="builder-grid">
      <input id="fieldLabel" placeholder="Field label" />
      <input id="fieldName" placeholder="Field name (e.g. paymentStatus)" />
      <select id="fieldType">
        <option value="text">text</option>
        <option value="email">email</option>
        <option value="date">date</option>
        <option value="textarea">textarea</option>
        <option value="select">select</option>
        <option value="checkbox">checkbox</option>
        <option value="radio">radio</option>
      </select>
      <input id="fieldPlaceholder" placeholder="Placeholder" />
      <input id="fieldOptions" placeholder="Options, comma separated" />
      <label><input type="checkbox" id="fieldRequired" /> Required</label>
      <button id="addFieldBtn" class="btn">Add field</button>
    </div>

    <ul id="fieldsList"></ul>
    <button id="createEventBtn" class="btn">Create event</button>
  </section>

  <section class="panel">
    <h2>Submissions</h2>
    <div class="actions">
      <input id="searchInput" placeholder="Search name, email, ticket, keywords" />
      <button id="exportCsvBtn" class="btn">Download CSV</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th><th>Email</th><th>Ticket</th><th>Dietary</th><th>Sessions</th><th>Payment</th><th>Timestamp</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="submissionsBody"></tbody>
    </table>
  </section>
</main>

<style>
  .admin-page { display: grid; grid-template-columns: 1fr 1.3fr; gap: 1rem; padding: 1rem; }
  .panel { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
  .field { margin-bottom: 0.75rem; display: grid; gap: 0.25rem; }
  .muted { color: #666; margin-top: 0; }
  input, textarea, select { padding: 0.55rem; border: 1px solid #ccc; border-radius: 6px; font: inherit; width: 100%; }
  .actions { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
  .builder-grid { display: grid; gap: 0.5rem; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 0.75rem; }
  .btn { background: #222; color: #fff; border: none; border-radius: 6px; padding: 0.55rem 0.8rem; cursor: pointer; }
  .btn-danger { background: #a11; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #ddd; padding: 0.45rem; vertical-align: top; font-size: 0.9rem; }
  ul { padding-left: 1rem; }
  @media (max-width: 980px) { .admin-page { grid-template-columns: 1fr; } }
</style>

<script>
const API = '/api';
const SUBMISSIONS_KEY = 'event_submissions_all';
let events = [];
let fields = [];
let selectedEventId = '';
let submissions = [];
const fieldPresets = {
  email: {
    label: 'Email',
    name: 'email',
    type: 'email',
    required: true,
    placeholder: 'name@example.com',
    validation: { kind: 'email' },
  },
  dob: {
    label: 'Date of Birth',
    name: 'dob',
    type: 'date',
    required: true,
    validation: { kind: 'date', noFuture: true },
  },
  phone: {
    label: 'Phone',
    name: 'phone',
    type: 'text',
    required: false,
    placeholder: '+61 4xx xxx xxx',
    validation: { pattern: '^[0-9+()\\-\\s]{8,20}$', message: 'Use 8-20 digits and phone symbols only.' },
  },
  full_name: {
    label: 'Full Name',
    name: 'name',
    type: 'text',
    required: true,
    placeholder: 'Full name',
    validation: { minLength: 2, message: 'Name must be at least 2 characters.' },
  },
};

const requiredDemoFields = [
  { name: 'name', label: 'Name', type: 'text', required: true, placeholder: 'Full name' },
  { name: 'email', label: 'Email', type: 'email', required: true, placeholder: 'name@example.com' },
  { name: 'ticket', label: 'Ticket type', type: 'select', required: true, options: ['General', 'VIP', 'Student'] },
  { name: 'dietary', label: 'Dietary requirements', type: 'text', required: false, placeholder: 'Optional' },
  { name: 'sessions', label: 'Session selections', type: 'checkbox', required: true, options: ['Opening Keynote', 'Workshop A', 'Workshop B', 'Closing Panel'] },
  { name: 'paymentStatus', label: 'Payment status', type: 'select', required: true, options: ['Pending', 'Paid', 'Complimentary', 'Invoiced'] },
];

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
}

async function loadEvents() {
  const res = await fetch(`${API}/events`);
  events = await res.json();
  const sel = document.getElementById('eventSelect');
  sel.innerHTML = events.length
    ? events.map((e) => `<option value="${e.id}">${esc(e.name)}</option>`).join('')
    : '<option value="">No events</option>';
  selectedEventId = sel.value || '';
  await loadSubmissions();
}

function getLocalSubmissions() {
  return JSON.parse(localStorage.getItem(SUBMISSIONS_KEY) || '[]');
}

function setLocalSubmissions(data) {
  localStorage.setItem(SUBMISSIONS_KEY, JSON.stringify(data));
}

async function loadSubmissions() {
  const local = getLocalSubmissions().filter((s) => !selectedEventId || s.event_id === selectedEventId);
  let apiRows = [];
  if (selectedEventId) {
    try {
      const res = await fetch(`${API}/events/${selectedEventId}/registrations`);
      if (res.ok) {
        const data = await res.json();
        apiRows = data.registrations || [];
      }
    } catch (err) {
      console.warn('Unable to load API submissions for selected event', err);
    }
  }
  const merged = [...apiRows];
  local.forEach((entry) => {
    if (!merged.some((m) => m.id === entry.id)) merged.push(entry);
  });
  submissions = merged;
  renderSubmissions(document.getElementById('searchInput').value || '');
}

function renderSubmissions(query) {
  const q = query.trim().toLowerCase();
  const filtered = submissions.filter((s) => {
    const haystack = [s.name, s.email, s.ticket, s.dietary, (s.sessions || []).join(' '), s.paymentStatus].join(' ').toLowerCase();
    return !q || haystack.includes(q);
  });

  const body = document.getElementById('submissionsBody');
  if (!filtered.length) {
    body.innerHTML = '<tr><td colspan="8">No submissions found</td></tr>';
    return;
  }

  body.innerHTML = filtered.map((s) => `
    <tr>
      <td contenteditable="true" data-id="${s.id}" data-k="name">${esc(s.name)}</td>
      <td contenteditable="true" data-id="${s.id}" data-k="email">${esc(s.email)}</td>
      <td contenteditable="true" data-id="${s.id}" data-k="ticket">${esc(s.ticket)}</td>
      <td contenteditable="true" data-id="${s.id}" data-k="dietary">${esc(s.dietary)}</td>
      <td contenteditable="true" data-id="${s.id}" data-k="sessions">${esc((s.sessions || []).join(' | '))}</td>
      <td contenteditable="true" data-id="${s.id}" data-k="paymentStatus">${esc(s.paymentStatus)}</td>
      <td>${new Date(s.timestamp).toLocaleString()}</td>
      <td><button class="btn btn-danger" onclick="removeSubmission('${s.id}')">Delete</button></td>
    </tr>
  `).join('');
}

function removeSubmission(id) {
  const all = getLocalSubmissions().filter((s) => s.id !== id);
  setLocalSubmissions(all);
  loadSubmissions();
}

function saveInlineEdits() {
  const all = getLocalSubmissions();
  document.querySelectorAll('#submissionsBody [contenteditable="true"]').forEach((cell) => {
    const item = all.find((x) => x.id === cell.dataset.id);
    if (!item) return;
    if (cell.dataset.k === 'sessions') {
      item.sessions = cell.textContent.split('|').map((s) => s.trim()).filter(Boolean);
    } else {
      item[cell.dataset.k] = cell.textContent.trim();
    }
  });
  setLocalSubmissions(all);
}

function csvCell(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function exportCsv() {
  const rows = submissions.map((s) => [
    csvCell(s.name), csvCell(s.email), csvCell(s.ticket), csvCell(s.dietary),
    csvCell((s.sessions || []).join(' | ')), csvCell(s.paymentStatus), csvCell(s.timestamp),
  ]);
  const content = [
    'Name,Email,Ticket type,Dietary requirements,Session selections,Payment status,Timestamp',
    ...rows.map((r) => r.join(',')),
  ].join('\n');
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'submissions.csv';
  a.click();
}

function renderFields() {
  const list = document.getElementById('fieldsList');
  list.innerHTML = fields.map((f, i) => `<li>${esc(f.label)} (${esc(f.type)}) <button class="btn btn-danger" onclick="removeField(${i})">Remove</button></li>`).join('');
}

window.removeField = function(idx) {
  fields.splice(idx, 1);
  renderFields();
};

async function createEvent() {
  const name = document.getElementById('eventName').value.trim();
  const description = document.getElementById('eventDesc').value.trim();
  if (!name) return alert('Event name is required');
  const formFields = [...requiredDemoFields, ...fields];
  const res = await fetch(`${API}/events`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, description, form_fields: formFields }),
  });
  if (!res.ok) return alert('Failed to create event');
  document.getElementById('eventName').value = '';
  document.getElementById('eventDesc').value = '';
  fields = [];
  renderFields();
  await loadEvents();
}

async function deleteSelectedEvent() {
  if (!selectedEventId) return;
  if (!confirm('Delete selected event?')) return;
  const res = await fetch(`${API}/events/${selectedEventId}`, { method: 'DELETE' });
  if (!res.ok) return alert('Failed to delete event');
  await loadEvents();
}

document.getElementById('eventSelect').addEventListener('change', (e) => {
  selectedEventId = e.target.value;
  loadSubmissions();
});
document.getElementById('searchInput').addEventListener('input', (e) => renderSubmissions(e.target.value));
document.getElementById('submissionsBody').addEventListener('focusout', saveInlineEdits);
document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);
document.getElementById('createEventBtn').addEventListener('click', createEvent);
document.getElementById('deleteEventBtn').addEventListener('click', deleteSelectedEvent);
document.getElementById('copyLinkBtn').addEventListener('click', async () => {
  if (!selectedEventId) return;
  const url = `${window.location.origin}/event/${selectedEventId}`;
  await navigator.clipboard.writeText(url);
});

document.getElementById('addFieldBtn').addEventListener('click', () => {
  const label = document.getElementById('fieldLabel').value.trim();
  const name = document.getElementById('fieldName').value.trim();
  const type = document.getElementById('fieldType').value;
  const placeholder = document.getElementById('fieldPlaceholder').value.trim();
  const required = document.getElementById('fieldRequired').checked;
  const options = document.getElementById('fieldOptions').value.split(',').map((o) => o.trim()).filter(Boolean);
  if (!label || !name) return alert('Field label and name are required');
  const field = { label, name, type, required, placeholder };
  if (['select', 'checkbox', 'radio'].includes(type)) {
    if (!options.length) return alert('Options are required for this field type');
    field.options = options;
  }
  fields.push(field);
  renderFields();
  document.getElementById('fieldLabel').value = '';
  document.getElementById('fieldName').value = '';
  document.getElementById('fieldPlaceholder').value = '';
  document.getElementById('fieldOptions').value = '';
  document.getElementById('fieldRequired').checked = false;
});

document.getElementById('applyPresetBtn').addEventListener('click', () => {
  const presetKey = document.getElementById('fieldPreset').value;
  if (!presetKey) return;
  const preset = fieldPresets[presetKey];
  if (!preset) return;
  const field = JSON.parse(JSON.stringify(preset));
  fields.push(field);
  renderFields();
});

loadEvents();
</script>
{% endblock %}
